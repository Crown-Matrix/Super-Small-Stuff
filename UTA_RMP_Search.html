<title>RMP Search</title>
<style>
:root{--bg:#fff;--fg:#111;--bd:#999;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--bd:#666}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--bd:#666}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center}
form{display:flex;gap:8px;width:90%;max-width:420px}
input{flex:1;font:inherit;padding:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px}
button{font:inherit;padding:10px 14px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
:root{--blue:#0064b1}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#4aa3e8}}:root[data-theme="dark"]{--blue:#4aa3e8}
html:root:root:root{--bg:#000;--fg:#eee;--bd:#666;color-scheme:dark}
.logo{width:min(270px,70%);height:auto;border-radius:8px}
</style>
