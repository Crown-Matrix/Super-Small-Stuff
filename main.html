<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shell Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="./main.js"></script>
<style>
  :root {
    --bg: #0a0908;
    --surface: #15130f;
    --surface-alt: #0f0d0b;
    --line: #2b2620;
    --line-hover: #433c32;
    --ink: #f0ece2;
    --ink-dim: #8c8579;
    --live: #d1552e;
    --live-bg: rgba(209, 85, 46, 0.1);
    --blank: #7c8792;
    --blank-bg: rgba(124, 135, 146, 0.1);
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Signature motif: a faint primer-cap ring glimpsed at the edge */
  body::before {
    content: "";
    position: fixed;
    top: -160px;
    right: -160px;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle,
      transparent 0 122px,
      rgba(240, 236, 226, 0.045) 122px 124px,
      transparent 124px 154px,
      rgba(240, 236, 226, 0.03) 154px 156px,
      transparent 156px 100%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; width: 100%; max-width: 380px; }

  .eyebrow {
    text-align: center;
    color: var(--ink-dim);
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 14px;
  }

  .rule { width: 40px; height: 2px; background: var(--line-hover); margin: 0 auto 28px; }

  /* ---------- Menu ---------- */
  .menu { display: flex; flex-direction: column; gap: 12px; }

  .btn {
    padding: 19px 22px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .btn:hover { border-color: var(--line-hover); background: #1a1712; }
  .btn:active { transform: scale(0.99); }

  /* ---------- Panels ---------- */
  .panel {
    display: none;
    flex-direction: column;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
  }
  .panel.active { display: flex; animation: fadeIn .18s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .back-link {
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: var(--font-display);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    padding: 0;
    margin: -6px 0 -4px;
  }
  .back-link:hover { color: var(--ink); }

  .field-label {
    display: block;
    font-size: 12px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }

  /* ---------- Choice buttons ---------- */
  .choice-row { display: flex; gap: 10px; }

  .choice-btn {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-alt);
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .choice-btn:hover { border-color: var(--line-hover); }

  .choice-btn[data-value="live"].selected {
    border-color: var(--live);
    color: var(--live);
    background: var(--live-bg);
  }
  .choice-btn[data-value="blank"].selected,
  .choice-btn[data-value="miss"].selected {
    border-color: var(--blank);
    color: var(--blank);
    background: var(--blank-bg);
  }

  /* ---------- Inputs ---------- */
  input[type="number"] {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-alt);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 16px;
  }
  input[type="number"]:focus { outline: none; border-color: var(--line-hover); }
  input[type="number"]::placeholder { color: #55504a; }

  /* ---------- Primary action button ---------- */
  .primary-btn {
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--ink);
    color: var(--bg);
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .primary-btn:hover:not(:disabled) { background: #dcd6c9; }
  .primary-btn:disabled { background: var(--surface-alt); color: var(--ink-dim); cursor: not-allowed; }

  /* ---------- View stats ---------- */
  .stat {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .stat:last-of-type { border-bottom: none; }

  .stat .label {
    font-size: 13px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .stat .value { font-family: var(--font-mono); font-size: 30px; font-weight: 700; }
  .stat.live .value { color: var(--live); }
  .stat.blank .value { color: var(--blank); }

  /* ---------- Accessibility ---------- */
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--ink-dim);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow">Shell Tracker</div>
  <div class="rule" aria-hidden="true"></div>

  <!-- Main menu -->
  <div class="menu" id="menu">
    <button class="btn" id="btn-next">Next</button>
    <button class="btn" id="btn-phone">Phone Call</button>
    <button class="btn" id="btn-view">View</button>
  </div>

  <!-- Next: conditional live/miss input -->
  <div class="panel" id="panel-next">
    <button class="back-link" data-back>‹ Back</button>
    <div>
      <span class="field-label">Result</span>
      <div class="choice-row">
        <button class="choice-btn" data-value="live">Live</button>
        <button class="choice-btn" data-value="miss">Miss</button>
      </div>
    </div>
    <button class="primary-btn" id="confirm-next" disabled>Log Result</button>
  </div>

  <!-- Phone Call: required integer + live/blank input -->
  <div class="panel" id="panel-phone">
    <button class="back-link" data-back>‹ Back</button>
    <div>
      <span class="field-label">Position</span>
      <input type="number" id="phone-number" step="1" placeholder="e.g. 3">
    </div>
    <div>
      <span class="field-label">Result</span>
      <div class="choice-row">
        <button class="choice-btn" data-value="live">Live</button>
        <button class="choice-btn" data-value="blank">Blank</button>
      </div>
    </div>
    <button class="primary-btn" id="confirm-phone" disabled>Log Call</button>
  </div>

  <!-- View: current percentages -->
  <div class="panel" id="panel-view">
    <div class="stat live">
      <span class="label">Live</span>
      <span class="value" id="live-value">--%</span>
    </div>
    <div class="stat blank">
      <span class="label">Blank</span>
      <span class="value" id="blank-value">--%</span>
    </div>
    <button class="primary-btn" id="done-view">Close</button>
  </div>
</div>

<script>
  /* =========================================================
     INTEGRATION POINTS — set/read these from your own script
     =========================================================

     Variables (globals — read fresh whenever you set them):
       GUARANTEED_NEXT   (boolean) — true skips the Live/Miss
                          prompt on "Next" entirely.
       LIVE_PERCENTAGE   (number)  — read the instant "View" opens.
       BLANK_PERCENTAGE  (number)  — read the instant "View" opens.

     Events (dispatched on document):
       "next"
         e.detail -> "live" | "miss" | null
         (null when GUARANTEED_NEXT is true, since no input was taken)
       "phone-call"
         e.detail -> { number: <integer>, result: "live" | "blank" }
     ========================================================= */

  var GUARANTEED_NEXT = false;
  var LIVE_PERCENTAGE = 0;
  var BLANK_PERCENTAGE = 0;

  // ---------- Elements ----------
  var menu = document.getElementById('menu');
  var panels = {
    next: document.getElementById('panel-next'),
    phone: document.getElementById('panel-phone'),
    view: document.getElementById('panel-view')
  };

  function showMenu() {
    menu.style.display = 'flex';
    for (var key in panels) panels[key].classList.remove('active');
  }

  function showPanel(name) {
    menu.style.display = 'none';
    for (var key in panels) panels[key].classList.remove('active');
    panels[name].classList.add('active');
  }

  // "continue the loop" = bring the menu buttons back
  function continueLoop() {
    showMenu();
  }

  function clearChoices(panel) {
    var btns = panel.querySelectorAll('.choice-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('selected');
  }

  // Back links just return to the menu — no event fired
  var backLinks = document.querySelectorAll('[data-back]');
  for (var i = 0; i < backLinks.length; i++) {
    backLinks[i].addEventListener('click', continueLoop);
  }

  // ---------- NEXT ----------
  var nextChoice = null;

  document.getElementById('btn-next').addEventListener('click', function () {
    if (GUARANTEED_NEXT) {
      document.dispatchEvent(new CustomEvent('next', { detail: null, bubbles: true }));
      continueLoop();
      return;
    }
    nextChoice = null;
    clearChoices(panels.next);
    document.getElementById('confirm-next').disabled = true;
    showPanel('next');
  });

  panels.next.querySelectorAll('.choice-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      clearChoices(panels.next);
      btn.classList.add('selected');
      nextChoice = btn.dataset.value;
      document.getElementById('confirm-next').disabled = false;
    });
  });

  document.getElementById('confirm-next').addEventListener('click', function () {
    document.dispatchEvent(new CustomEvent('next', { detail: nextChoice, bubbles: true }));
    continueLoop();
  });

  // ---------- PHONE CALL ----------
  var phoneChoice = null;
  var phoneInput = document.getElementById('phone-number');
  var confirmPhone = document.getElementById('confirm-phone');

  document.getElementById('btn-phone').addEventListener('click', function () {
    phoneChoice = null;
    phoneInput.value = '';
    clearChoices(panels.phone);
    confirmPhone.disabled = true;
    showPanel('phone');
  });

  panels.phone.querySelectorAll('.choice-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      clearChoices(panels.phone);
      btn.classList.add('selected');
      phoneChoice = btn.dataset.value;
      validatePhone();
    });
  });

  phoneInput.addEventListener('input', validatePhone);

  function validatePhone() {
    var raw = phoneInput.value.trim();
    var isValidInt = raw !== '' && Number.isInteger(Number(raw));
    confirmPhone.disabled = !(isValidInt && phoneChoice);
  }

  confirmPhone.addEventListener('click', function () {
    var number = parseInt(phoneInput.value, 10);
    document.dispatchEvent(new CustomEvent('phone-call', {
      detail: { number: number, result: phoneChoice },
      bubbles: true
    }));
    continueLoop();
  });

  // ---------- VIEW ----------
  function formatPct(n) {
    if (typeof n !== 'number' || isNaN(n)) return '--';
    return (Math.round(n * 10) / 10) + '%';
  }

  document.getElementById('btn-view').addEventListener('click', function () {
    document.getElementById('live-value').textContent = formatPct(LIVE_PERCENTAGE);
    document.getElementById('blank-value').textContent = formatPct(BLANK_PERCENTAGE);
    showPanel('view');
  });

  document.getElementById('done-view').addEventListener('click', continueLoop);

  // ---------- Example listeners (safe to delete — for reference only) ----------
  // document.addEventListener('next', function (e) { console.log('next:', e.detail); });
  // document.addEventListener('phone-call', function (e) { console.log('phone-call:', e.detail); });
</script>
</body>
</html>
